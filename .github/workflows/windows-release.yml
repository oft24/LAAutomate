name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ejecutar pruebas deterministas
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_design_components.py
          tests/test_controles_ui.py
          tests/test_revision_ux.py
          tests/test_revision_flujos.py
          tests/test_adjuntar_capturas.py
          tests/test_idioma_copia.py
          tests/test_disponibilidad.py
          tests/test_distribucion_publica.py

      - name: Construir aplicación
        shell: cmd
        run: empaquetar.bat

      - name: Crear ZIP instalable
        shell: pwsh
        run: Compress-Archive -Path dist/LaAutomate -DestinationPath dist/LaAutomate-Windows-x64.zip -Force

      - name: Guardar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LaAutomate-Windows-x64
          path: dist/LaAutomate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = gh release view "$env:RELEASE_TAG" --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (@($assets) -contains 'LaAutomate-Windows-x64.zip') {
              Write-Output 'La Release ya contiene el instalador. Se conserva el archivo publicado.'
              exit 0
            }
            gh release upload "$env:RELEASE_TAG" dist/LaAutomate-Windows-x64.zip
          } else {
            gh release create "$env:RELEASE_TAG" dist/LaAutomate-Windows-x64.zip --verify-tag --generate-notes --title "LaAutomate $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
